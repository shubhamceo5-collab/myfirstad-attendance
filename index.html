<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myfirstad HRMS — People & Workforce</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#171a2b;--muted:#81889a;--line:#e9eaf0;--purple:#6c5ce7;--purple2:#8b5cf6;--green:#18a66a;--orange:#f59e0b;--shadow:0 10px 30px rgba(29,31,55,.06)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 15%,#e8e3ff,transparent 30%),radial-gradient(circle at 85% 80%,#e5eaff,transparent 28%),#f8f9fc}.login-card{width:min(440px,100%);background:#fff;border-radius:28px;padding:38px;box-shadow:0 25px 70px #28204c18}.logo{font-size:27px;font-weight:850;letter-spacing:-.8px;margin-bottom:7px}.logo:before{content:"M";display:inline-grid;place-items:center;width:36px;height:36px;margin-right:9px;border-radius:11px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-size:18px}.sub{color:var(--muted);margin-bottom:28px}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:8px;color:#4c5264}.field input,.field select{width:100%;padding:13px 14px;border:1px solid #dfe2eb;border-radius:12px;outline:none;background:#fff}.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:750;transition:.18s}.btn:hover{transform:translateY(-1px)}.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}.success{background:#eaf8f1;color:#128456}.danger{background:#fff0f0;color:#d93636}.light{background:#f2f3f7;color:#3b4254}
.app{display:flex;min-height:100vh}.side{width:250px;background:linear-gradient(180deg,#15162b,#20213a);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.side .brand{font-weight:850;font-size:21px;padding:8px 12px 30px}.side .brand:before{content:"M";display:inline-grid;place-items:center;width:34px;height:34px;margin-right:9px;border-radius:10px;background:linear-gradient(135deg,#7567ef,#a855f7);vertical-align:middle}.nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:#b9bdd0;text-align:left;padding:12px 13px;border-radius:11px;cursor:pointer;margin:4px 0;font-weight:650}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.nav button:last-child{color:#ffb0b0}.main{margin-left:250px;width:calc(100% - 250px);padding:30px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{margin:0;font-size:29px;letter-spacing:-.8px}.user{color:var(--muted);font-size:13px;background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow)}.metric{font-size:30px;font-weight:850;margin-top:7px}.muted{color:var(--muted);font-size:13px}.section{margin-top:21px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title h2{font-size:18px;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table tr:last-child td{border-bottom:0}.table th{color:#8a91a2;font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:#fafafd}.pill{display:inline-block;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800}.present{background:#dcfce7;color:#166534}.late{background:#fef3c7;color:#92400e}.leave,.approved{background:#dbeafe;color:#1e40af}.absent,.rejected{background:#fee2e2;color:#991b1b}.wfh{background:#ede9fe;color:#5b21b6}.pending{background:#fff7ed;color:#9a3412}.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid #d8dee8;border-radius:10px;background:#fff}.empty{padding:38px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#1113268c;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}.modal-card{background:#fff;width:min(500px,100%);border-radius:21px;padding:27px;box-shadow:0 25px 80px #0003}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.employee-hero{background:linear-gradient(135deg,#18172f 0%,#292257 55%,#5d4ed1 100%);color:#fff;border:0;overflow:hidden;position:relative;padding:28px}.employee-hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-120px;background:#ffffff12}.hero-row{display:flex;justify-content:space-between;align-items:center;gap:20px;position:relative;z-index:1}.greeting{font-size:14px;color:#c8c5dc;margin-bottom:7px}.hero-name{font-size:28px;font-weight:850;letter-spacing:-.8px}.hero-date{margin-top:8px;color:#c8c5dc;font-size:13px}.clock{min-width:235px;text-align:center;background:#ffffff12;border:1px solid #ffffff1c;border-radius:18px;padding:18px}.clock-time{font-size:28px;font-weight:850}.clock-status{font-size:12px;color:#d8d5e9;margin-top:5px}.checkin{margin-top:15px;width:100%;padding:13px}.quick-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.today-card{min-height:180px}.time-track{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.time-box{background:#f8f8fc;border-radius:13px;padding:14px}.time-box strong{display:block;font-size:20px;margin-top:4px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{padding:17px}.mini .mini-num{font-size:24px;font-weight:850;margin-top:5px}.leave-balance{background:linear-gradient(135deg,#f2efff,#faf9ff);border-color:#e2ddff}.progress{height:7px;background:#e5e3f5;border-radius:10px;margin-top:13px;overflow:hidden}.progress span{display:block;height:100%;width:70%;background:linear-gradient(90deg,var(--purple),var(--purple2));border-radius:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:13px}.day{height:34px;border-radius:9px;display:grid;place-items:center;font-size:12px;color:#606779;background:#f7f7fa}.day.today{background:var(--purple);color:#fff;font-weight:800}.day.present{background:#dcfce7;color:#166534}.day.weekend{background:#f0f0f4;color:#a0a4af}.holiday-list{display:grid;gap:10px}.holiday-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.holiday-item:last-child{border-bottom:0}.holiday-date{font-size:12px;color:var(--muted)}.holiday-name{font-weight:750;margin-top:2px}
@media(max-width:900px){.side{width:76px;padding:15px 8px}.side .brand{font-size:0;text-align:center}.side .brand:before{margin:0}.nav button{font-size:0;justify-content:center;padding:13px}.nav button:before{font-size:18px}.nav button:nth-child(1):before{content:"⌂"}.nav button:nth-child(2):before{content:"✓"}.nav button:nth-child(3):before{content:"👥"}.nav button:nth-child(4):before{content:"◷"}.nav button:nth-child(5):before{content:"★"}.nav button:nth-child(6):before{content:"▣"}.nav button:last-child:before{content:"↪"}.main{margin-left:76px;width:calc(100% - 76px);padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:1fr}.hero-row{align-items:flex-start;flex-direction:column}.clock{width:100%}}@media(max-width:560px){.login-card{padding:28px 22px}.main{padding:16px}.top h1{font-size:23px}.grid,.mini-grid{grid-template-columns:1fr 1fr}.employee-hero{padding:22px}.hero-name{font-size:24px}.time-track{grid-template-columns:1fr}.calendar{gap:5px}}
.hrms-kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:800;color:#8a91a2}.hrms-welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}.hrms-welcome h2{font-size:25px;letter-spacing:-.6px;margin:5px 0}.hrms-welcome p{margin:0;color:var(--muted);font-size:13px}.metric-card{position:relative;overflow:hidden}.metric-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#f1efff;color:var(--purple);font-weight:900;margin-bottom:12px}.metric-trend{font-size:11px;color:var(--green);font-weight:750;margin-top:8px}.profile-card{display:grid;grid-template-columns:90px 1fr;gap:20px;align-items:center}.profile-avatar{width:90px;height:90px;border-radius:25px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.profile-field{background:#f8f8fb;border-radius:13px;padding:14px}.profile-field span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.profile-field strong{font-size:14px}@media(max-width:560px){.hrms-welcome{align-items:flex-start;flex-direction:column}.profile-card{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr 1fr}}</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">Myfirstad HRMS</div><div class="sub">People, attendance, leave & workforce management — all in one place.</div>
    <div class="field"><label>Email</label><input id="email" type="email" value="admin@myfirstad.in"></div>
    <div class="field"><label>Password</label><input id="password" type="password" value="admin123"></div>
    <button class="btn primary" style="width:100%;padding:13px" onclick="login()">Sign in →</button>
    <p class="muted" style="margin-top:16px">Demo admin: admin@myfirstad.in / admin123<br>Demo employee: rahul@myfirstad.in / 123456</p>
  </div>
</div>
<div id="app" class="app hidden">
<aside class="side"><div class="brand">Myfirstad</div><div class="nav">
<button id="nav-dashboard" onclick="show('dashboard')">Dashboard</button>
<button id="nav-attendance" onclick="show('attendance')">Attendance</button>
<button id="nav-employees" onclick="show('employees')">People</button>
<button id="nav-leaves" onclick="show('leaves')">Leaves</button>
<button id="nav-holidays" onclick="show('holidays')">Holidays</button>
<button id="nav-reports" onclick="show('reports')">Reports</button><button id="nav-profile" onclick="show('profile')">My Profile</button>
<button onclick="logout()" style="margin-top:30px">Logout</button>
</div></aside>
<main class="main"><div class="top"><h1 id="pageTitle">Dashboard</h1><div class="user" id="userLabel"></div></div><div id="content"></div></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalBody"></div></div>
<script>
const KEY='myfirstad_attendance_v1';
const today=()=>new Date().toISOString().slice(0,10);
const seed={employees:[
{id:1,name:'Shubham Gupta',email:'admin@myfirstad.in',role:'Admin',leave:18},
{id:2,name:'Rahul',email:'rahul@myfirstad.in',role:'Employee',leave:12},
{id:3,name:'Aman',email:'aman@myfirstad.in',role:'Employee',leave:12},
{id:4,name:'Priya',email:'priya@myfirstad.in',role:'Employee',leave:12}],
attendance:[],leaves:[],holidays:[
{id:1,date:'2026-10-20',name:'Diwali'},{id:2,date:'2026-10-25',name:'Govardhan Puja'},{id:3,date:'2026-11-04',name:'Guru Nanak Jayanti'}]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;let current=null;let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function login(){const e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;const map={'admin@myfirstad.in':'admin123','rahul@myfirstad.in':'123456','aman@myfirstad.in':'123456','priya@myfirstad.in':'123456'};if(map[e]!==p)return alert('Invalid login');current=db.employees.find(x=>x.email===e);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userLabel').textContent=current.name+' · '+current.role;show(current.role==='Admin'?'dashboard':'attendance')}
function logout(){current=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function show(p){page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));const n=document.getElementById('nav-'+p);if(n)n.classList.add('active');document.getElementById('pageTitle').textContent=p[0].toUpperCase()+p.slice(1);render()}
function canAdmin(){return current&&current.role==='Admin'}
function attFor(empId,date=today()){return db.attendance.find(x=>x.employeeId===empId&&x.date===date)}
function checkIn(){let a=attFor(current.id);if(a)return alert('Already checked in today');const now=new Date();const late=now.getHours()>9||(now.getHours()===9&&now.getMinutes()>30);db.attendance.push({id:Date.now(),employeeId:current.id,date:today(),in:now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),out:'',status:late?'Late':'Present'});save();render()}
function checkOut(){let a=attFor(current.id);if(!a)return alert('Check in first');if(a.out)return alert('Already checked out');a.out=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});save();render()}
function applyLeave(){openModal('<h2>Apply Leave</h2><div class="field"><label>From</label><input id="lf" type="date" value="'+today()+'"></div><div class="field"><label>To</label><input id="lt" type="date" value="'+today()+'"></div><div class="field"><label>Reason</label><input id="lr" placeholder="Reason"></div><div class="modal-actions"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitLeave()">Apply</button></div>')}
function submitLeave(){const f=lf.value,t=lt.value,r=lr.value.trim();if(!f||!t||f>t)return alert('Select valid dates');db.leaves.push({id:Date.now(),employeeId:current.id,from:f,to:t,reason:r,status:'Pending'});save();closeModal();render()}
function approveLeave(id,ok){const l=db.leaves.find(x=>x.id===id);if(!l)return;l.status=ok?'Approved':'Rejected';if(ok){const e=db.employees.find(x=>x.id===l.employeeId);const days=(new Date(l.to)-new Date(l.from))/86400000+1;e.leave=Math.max(0,e.leave-days)}save();render()}
function addHoliday(){openModal('<h2>Add Holiday</h2><div class="field"><label>Date</label><input id="hd" type="date"></div><div class="field"><label>Name</label><input id="hn" placeholder="Holiday name"></div><div class="modal-actions"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitHoliday()">Add</button></div>')}
function submitHoliday(){if(!hd.value||!hn.value.trim())return alert('Enter date and name');db.holidays.push({id:Date.now(),date:hd.value,name:hn.value.trim()});save();closeModal();render()}
function addEmployee(){openModal('<h2>Add Employee</h2><div class="field"><label>Name</label><input id="en"></div><div class="field"><label>Email</label><input id="ee" type="email"></div><div class="field"><label>Leave balance</label><input id="el" type="number" value="12"></div><div class="modal-actions"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitEmployee()">Add</button></div>')}
function submitEmployee(){if(!en.value||!ee.value)return alert('Enter name and email');db.employees.push({id:Date.now(),name:en.value.trim(),email:ee.value.trim().toLowerCase(),role:'Employee',leave:+el.value||0});save();closeModal();render()}
function openModal(x){modal.classList.remove('hidden');modalBody.innerHTML=x}function closeModal(){modal.classList.add('hidden')}
function badge(s){return '<span class="pill '+s.toLowerCase()+'">'+s+'</span>'}
function render(){if(!current)return; if(page==='dashboard')return dashboard();if(page==='attendance')return attendance();if(page==='employees')return employees();if(page==='leaves')return leaves();if(page==='holidays')return holidays();if(page==='reports')return reports();if(page==='profile')return profile()}
function dashboard(){if(canAdmin()){const mine=db.attendance.filter(x=>x.date===today());const present=mine.filter(x=>x.status==='Present').length,late=mine.filter(x=>x.status==='Late').length;document.getElementById('content').innerHTML='<div class="grid"><div class="card"><div class="muted">Present today</div><div class="metric">'+present+'</div></div><div class="card"><div class="muted">Late today</div><div class="metric">'+late+'</div></div><div class="card"><div class="muted">Leave balance</div><div class="metric">'+current.leave+'</div></div><div class="card"><div class="muted">Holidays</div><div class="metric">'+db.holidays.length+'</div></div></div><div class="section"><div class="section-title"><h2>Today</h2><span class="muted">'+today()+'</span></div>'+teamTable()+'</div>';}else{employeeDashboard()}}
function teamTable(){return '<div class="table-wrap"><table class="table"><tr><th>Employee</th><th>Check in</th><th>Check out</th><th>Status</th></tr>'+db.employees.filter(e=>e.role!=='Admin').map(e=>{const a=attFor(e.id);return '<tr><td>'+e.name+'</td><td>'+(a?.in||'—')+'</td><td>'+(a?.out||'—')+'</td><td>'+badge(a?.status||'Absent')+'</td></tr>'}).join('')+'</table></div>'}
function employeeDashboard(){const a=attFor(current.id);const now=new Date();const time=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});const dateLabel=now.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});const month=today().slice(0,7);const mine=db.attendance.filter(x=>x.employeeId===current.id&&x.date.startsWith(month));const present=mine.filter(x=>x.status==='Present').length;const late=mine.filter(x=>x.status==='Late').length;const approved=db.leaves.filter(x=>x.employeeId===current.id&&x.status==='Approved');const upcoming=db.holidays.filter(x=>x.date>=today()).slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);let days='';for(let i=1;i<=30;i++){const d=month+'-'+String(i).padStart(2,'0');const aa=attFor(current.id,d);days+='<div class="day '+(d===today()?'today ':'' )+(aa?'present ':'')+'">'+i+'</div>'}document.getElementById('content').innerHTML='<div class="card employee-hero"><div class="hero-row"><div><div class="greeting">Good to see you back 👋</div><div class="hero-name">'+current.name+'</div><div class="hero-date">'+dateLabel+'</div></div><div class="clock"><div class="clock-time">'+time+'</div><div class="clock-status">'+(a?(a.out?'Workday completed':'Checked in at '+a.in):'Not checked in yet')+'</div><button class="btn '+(a?'danger':'success')+' checkin" onclick="'+(a?'checkOut()':'checkIn()')+'">'+(a?'Check Out':'Check In')+'</button></div></div></div><div class="section mini-grid"><div class="card mini"><div class="muted">This month</div><div class="mini-num">'+present+'</div><div class="muted">Present days</div></div><div class="card mini"><div class="muted">Late</div><div class="mini-num">'+late+'</div><div class="muted">Days this month</div></div><div class="card mini leave-balance"><div class="muted">Leave balance</div><div class="mini-num">'+current.leave+'</div><div class="muted">Days remaining</div></div></div><div class="section quick-grid"><div class="card today-card"><div class="section-title"><h2>Today's timeline</h2><span class="muted">'+(a?a.status:'Not started')+'</span></div><div class="time-track"><div class="time-box"><div class="muted">Check in</div><strong>'+(a?.in||'—')+'</strong></div><div class="time-box"><div class="muted">Check out</div><strong>'+(a?.out||'—')+'</strong></div></div></div><div class="card leave-balance"><div class="muted">Leave balance</div><div class="metric">'+current.leave+' days</div><div class="progress"><span></span></div><button class="btn light" style="margin-top:14px;width:100%" onclick="show(\'leaves\')">Manage leave →</button></div></div><div class="section quick-grid"><div class="card"><div class="section-title"><h2>Attendance this month</h2><span class="muted">'+month+'</span></div><div class="calendar">'+days+'</div></div><div class="card"><div class="section-title"><h2>Upcoming holidays</h2><button class="btn light" onclick="show(\'holidays\')">View all</button></div><div class="holiday-list">'+(upcoming.length?upcoming.map(h=>'<div class="holiday-item"><div><div class="holiday-name">'+h.name+'</div><div class="holiday-date">'+h.date+'</div></div><span>🎉</span></div>').join(''):'<div class="empty">No upcoming holidays</div>')+'</div></div></div>'}

function attendance(){let rows=(canAdmin()?db.attendance:db.attendance.filter(x=>x.employeeId===current.id)).slice().reverse();document.getElementById('content').innerHTML='<div class="toolbar"><input id="adate" type="date" value="'+today()+'" onchange="filterAttendance()"></div><div id="attTable">'+attTable(rows)+'</div>'}
function filterAttendance(){const d=adate.value;let rows=(canAdmin()?db.attendance:db.attendance.filter(x=>x.employeeId===current.id)).filter(x=>!d||x.date===d).slice().reverse();document.getElementById('attTable').innerHTML=attTable(rows)}
function attTable(rows){return '<div class="table-wrap"><table class="table"><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th>Status</th></tr>'+rows.map(a=>'<tr><td>'+a.date+'</td><td>'+db.employees.find(e=>e.id===a.employeeId)?.name+'</td><td>'+a.in+'</td><td>'+a.out+'</td><td>'+badge(a.status)+'</td></tr>').join('')+'</table></div>'||'<div class="empty">No attendance records.</div>'}
function employees(){if(!canAdmin())return show('attendance');document.getElementById('content').innerHTML='<div class="section-title"><h2>Team</h2><button class="btn primary" onclick="addEmployee()">Add employee</button></div><div class="table-wrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Leave balance</th></tr>'+db.employees.map(e=>'<tr><td>'+e.name+'</td><td>'+e.email+'</td><td>'+e.role+'</td><td>'+e.leave+'</td></tr>').join('')+'</table></div>'}
function leaves(){const rows=canAdmin()?db.leaves:db.leaves.filter(x=>x.employeeId===current.id);document.getElementById('content').innerHTML='<div class="section-title"><h2>Leave requests</h2><button class="btn primary" onclick="applyLeave()">Apply leave</button></div><div class="table-wrap"><table class="table"><tr><th>Employee</th><th>Dates</th><th>Reason</th><th>Status</th><th>Action</th></tr>'+rows.slice().reverse().map(l=>'<tr><td>'+db.employees.find(e=>e.id===l.employeeId)?.name+'</td><td>'+l.from+' → '+l.to+'</td><td>'+l.reason+'</td><td>'+badge(l.status)+'</td><td>'+(canAdmin()&&l.status==='Pending'?'<button class="btn success" onclick="approveLeave('+l.id+',true)">Approve</button> <button class="btn danger" onclick="approveLeave('+l.id+',false)">Reject</button>':'—')+'</td></tr>').join('')+'</table></div>'}
function holidays(){document.getElementById('content').innerHTML='<div class="section-title"><h2>Holiday calendar</h2>'+(canAdmin()?'<button class="btn primary" onclick="addHoliday()">Add holiday</button>':'')+'</div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Holiday</th></tr>'+db.holidays.sort((a,b)=>a.date.localeCompare(b.date)).map(h=>'<tr><td>'+h.date+'</td><td>'+h.name+'</td></tr>').join('')+'</table></div>'}
function reports(){if(!canAdmin())return show('attendance');const month=today().slice(0,7);const rows=db.employees.map(e=>{const a=db.attendance.filter(x=>x.employeeId===e.id&&x.date.startsWith(month));return {e,a}});document.getElementById('content').innerHTML='<div class="section-title"><h2>Monthly report · '+month+'</h2><button class="btn primary" onclick="exportCSV()">Export CSV</button></div><div class="table-wrap"><table class="table"><tr><th>Employee</th><th>Present</th><th>Late</th><th>Leave</th><th>Attendance entries</th></tr>'+rows.map(x=>'<tr><td>'+x.e.name+'</td><td>'+x.a.filter(a=>a.status==='Present').length+'</td><td>'+x.a.filter(a=>a.status==='Late').length+'</td><td>'+db.leaves.filter(l=>l.employeeId===x.e.id&&l.status==='Approved').length+'</td><td>'+x.a.length+'</td></tr>').join('')+'</table></div>'}
function exportCSV(){const data=[['Date','Employee','Email','Check In','Check Out','Status'],...db.attendance.map(a=>{const e=db.employees.find(x=>x.id===a.employeeId);return [a.date,e.name,e.email,a.in,a.out,a.status]})];const blob=new Blob([data.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='myfirstad-attendance.csv';a.click();URL.revokeObjectURL(u)}
function profile(){const initials=current.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();document.getElementById('content').innerHTML='<div class="section-title"><h2>My Profile</h2><span class="muted">Employee self service</span></div><div class="card profile-card"><div class="profile-avatar">'+initials+'</div><div><div class="hrms-kicker">'+current.role+'</div><h2 style="margin:5px 0">'+current.name+'</h2><div class="muted">'+current.email+'</div></div></div><div class="card section"><div class="section-title"><h2>Employment details</h2></div><div class="profile-grid"><div class="profile-field"><span>Department</span><strong>Marketing & Growth</strong></div><div class="profile-field"><span>Designation</span><strong>'+current.role+'</strong></div><div class="profile-field"><span>Leave balance</span><strong>'+current.leave+' days</strong></div><div class="profile-field"><span>Work location</span><strong>Myfirstad Office</strong></div></div></div>'}
</script>
</body>
</html>
